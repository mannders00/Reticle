[package]
name = "reticle"
version = "1.2.1"
description = "Local-first desktop app for drawing infrastructure diagrams and connecting them to live health"
authors = ["Matt Anderson <matt@masoftware.net>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/mannders00/reticle"
homepage = "https://reticle.live"
readme = "../README.md"
keywords = ["infrastructure", "operations", "topology", "tauri"]
categories = ["visualization"]

[lib]
name = "reticle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reticle-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "net"] }
nix = { version = "0.29", features = ["process", "term", "fs"] }
libc = "0.2"
shellexpand = "3"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
