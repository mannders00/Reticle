# Desktop release builds — free GitHub-hosted runners, all three platforms.
#
# Cut a release by pushing a version tag to this repo:
#   git tag v1.2.1 && git push origin v1.2.1
# (from the internal repo: `make release-oss VERSION=1.2.1`)
#
# Matrix jobs build workflow artifacts; the publish job verifies and attaches
# the complete set to one draft GitHub Release:
#   macOS   .dmg           (Apple Silicon + Intel)
#   Linux   .AppImage/.deb/.rpm (x86_64)
#   Windows .msi/.exe      (x86_64)

name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string
      artifact_run_id:
        description: Prior successful build-matrix run to reuse
        required: false
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Validate tag and checkout
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          VERSION="${RELEASE_TAG#v}" node -e \
            'const c = require("./src-tauri/tauri.conf.json"); if (c.version !== process.env.VERSION) process.exit(1)'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev rpm
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: JavaScript tests
        run: bun run test

  build:
    needs: preflight
    if: ${{ inputs.artifact_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # arm64 (Apple Silicon)
            target: aarch64-apple-darwin
          - platform: macos-latest        # x86_64 (Intel) — cross from arm64
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04        # x86_64 AppImage/deb/rpm
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest      # x86_64 msi/nsis
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Linux system deps (webkit2gtk et al.)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Build desktop bundles
        run: bun run tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe

  publish:
    needs: [preflight, build]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify and complete release inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-dist
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            test ! -e "release-dist/$name"
            cp "$file" "release-dist/$name"
          done < <(find dist -type f -print0)
          rm -rf dist
          mv release-dist dist
          test "$(find dist -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          for pattern in '*.AppImage' '*.deb' '*.rpm' '*.msi' '*.exe'; do
            test "$(find dist -maxdepth 1 -type f -name "$pattern" | wc -l)" -ge 1
          done
          if find dist -maxdepth 1 -type f ! \( -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' \) \
            -print -quit | grep -q .; then
            echo "Unexpected desktop release asset" >&2
            exit 1
          fi
          cp LICENSE THIRD_PARTY_NOTICES dist/
          (cd dist && sha256sum * > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_args=()
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || release_args+=(--prerelease)
          cat > release-notes.md <<'NOTES'
            ## Downloads

            | Platform | File |
            |---|---|
            | **macOS** (Apple Silicon) | `Reticle_*_aarch64.dmg` |
            | **macOS** (Intel) | `Reticle_*_x64.dmg` |
            | **Linux** (x86_64) | `Reticle_*_amd64.AppImage` · `.deb` · `.rpm` |
            | **Windows** (x86_64) | `Reticle_*_x64-setup.exe` · `.msi` |

            macOS builds are unsigned for now — right-click → Open the first
            time (or `xattr -dr com.apple.quarantine Reticle.app`).
            Reticle Desktop is free, open source, standalone, and local-only for
            individuals and homelabs. Every platform includes the visual
            operational graph, fixed checks and guarded named actions, optional
            custom SSH checks behind the global privileged-mode toggle, opt-in loopback JSON
            API/read-only MCP, optional read-only chat, and PDF export. Custom
            commands are not guaranteed read-only; use a restricted SSH
            principal. Desktop does not include a shared daemon.

            The **[Team Daemon](https://reticle.live/team/)** provides shared,
            always-on browser access for $199/month or $1,999/year per daemon.
            White-glove installation and operational mapping starts at $3,000
            one-time.
          NOTES
          gh release create "$RELEASE_TAG" dist/* \
            --draft --verify-tag --title "Reticle $RELEASE_TAG" \
            --notes-file release-notes.md "${release_args[@]}"
