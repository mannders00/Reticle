# Desktop release builds — free GitHub-hosted runners, all three platforms.
#
# Cut a release by pushing a version tag to this repo:
#   git tag v1.1.0 && git push origin v1.1.0
# (from the internal repo: `make release-oss VERSION=1.1.0`)
#
# tauri-action builds the bundles and attaches them to ONE GitHub Release
# for the tag, so the repo sidebar's "Releases" shows a tidy download list:
#   macOS   .dmg           (Apple Silicon + Intel)
#   Linux   .AppImage/.deb/.rpm (x86_64)
#   Windows .msi/.exe      (x86_64)

name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate tag and checkout
        shell: bash
        run: |
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          VERSION="${GITHUB_REF_NAME#v}" node -e \
            'const c = require("./src-tauri/tauri.conf.json"); if (c.version !== process.env.VERSION) process.exit(1)'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: bun run test

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # arm64 (Apple Silicon)
            target: aarch64-apple-darwin
          - platform: macos-latest        # x86_64 (Intel) — cross from arm64
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04        # x86_64 AppImage/deb/rpm
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest      # x86_64 msi/nsis
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Linux system deps (webkit2gtk et al.)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: oven-sh/setup-bun@v2
      - run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (no-ops while the secrets are
          # unset — builds stay unsigned until the Apple setup is done).
          # See the signing runbook in the release plan / DEPLOY notes.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: "Reticle ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ## Downloads

            | Platform | File |
            |---|---|
            | **macOS** (Apple Silicon) | `Reticle_*_aarch64.dmg` |
            | **macOS** (Intel) | `Reticle_*_x64.dmg` |
            | **Linux** (x86_64) | `Reticle_*_amd64.AppImage` · `.deb` · `.rpm` |
            | **Windows** (x86_64) | `Reticle_*_x64-setup.exe` · `.msi` |

            macOS builds are unsigned for now — right-click → Open the first
            time (or `xattr -dr com.apple.quarantine Reticle.app`).
            Reticle Desktop is free, open source, standalone, and local-only for
            individuals and homelabs. Every platform includes the visual
            operational graph, guarded checks and named actions, opt-in
            loopback JSON API/read-only MCP, optional read-only chat, and PDF
            export. It does not include a shared daemon.

            The **[Team Daemon](https://reticle.live/team/)** provides shared,
            always-on browser access for $199/month or $1,999/year per daemon.
            White-glove installation and operational mapping starts at $3,000
            one-time.
