# Reticle sample — AWS three-tier production
# Route 53 → CloudFront → ALB in a public subnet, an app tier, and an
# RDS primary/replica pair — nested region → VPC → subnets, with a
# bastion tunnel for operators.
# Visual-only sample. Adapt collectors or guarded named actions from
# topology.yaml.example for your own endpoints, credentials, and services.
version: 1
nodes:
  route53:
    id: route53
    kind: dns
    title: route53
    subtitle: "app.example.com"
    x: 60
    y: 80
    w: 160
    h: 100
    notes: "ALIAS to CloudFront. TTL 60 — cutovers propagate fast, typos propagate faster."

  cloudfront:
    id: cloudfront
    kind: cdn
    title: cloudfront
    subtitle: "TLS · edge cache"
    x: 60
    y: 260
    w: 180
    h: 140
    notes: "Static under /assets/* cached 24h; everything else passes through to the ALB."

  s3-assets:
    id: s3-assets
    kind: object-store
    title: s3-assets
    subtitle: "static + uploads"
    x: 60
    y: 480
    w: 180
    h: 140
    notes: "Versioning on. Lifecycle: uploads → IA after 30d. Never public — CloudFront OAC only."

  region-use1:
    id: region-use1
    kind: region
    title: us-east-1
    subtitle: "production"
    x: 320
    y: 40
    w: 1240
    h: 880

  vpc-prod:
    id: vpc-prod
    kind: vpc
    title: vpc-prod
    subtitle: "10.0.0.0/16"
    x: 360
    y: 120
    w: 1160
    h: 760
    parentId: region-use1
    notes: "Flow logs → s3. Peered to vpc-tools (not drawn) for CI runners."

  subnet-public:
    id: subnet-public
    kind: subnet
    title: public
    subtitle: "10.0.1.0/24 · IGW"
    x: 400
    y: 200
    w: 540
    h: 260
    parentId: vpc-prod

  alb:
    id: alb
    kind: load-balancer
    title: alb-prod
    subtitle: "443 → app:8080"
    x: 440
    y: 280
    w: 220
    h: 120
    parentId: subnet-public
    spec: { host: 10.0.1.10, port: 443, user: ec2-user }
    notes: "Health check: GET /healthz, 2×5s. Deregistration delay 30s — deploys drain fast."

  bastion:
    id: bastion
    kind: bastion
    title: bastion
    subtitle: "SSM + ssh · t4g.nano"
    x: 720
    y: 280
    w: 180
    h: 120
    parentId: subnet-public
    spec: { host: 10.0.1.5, port: 22, user: ec2-user }
    notes: |
      The only SSH ingress. DB access: ssh -L 5432:rds-primary:5432 bastion.
      Sessions are logged; don't be interesting.

  elasticache:
    id: elasticache
    kind: cache
    title: elasticache
    subtitle: "redis 7 · sessions"
    x: 1080
    y: 280
    w: 160
    h: 140
    parentId: vpc-prod
    spec: { host: 10.0.4.10, port: 6379, user: ec2-user }
    notes: "Session store + hot config. Data is disposable; latency is not."

  subnet-app:
    id: subnet-app
    kind: subnet
    title: app
    subtitle: "10.0.2.0/24 · private"
    x: 400
    y: 540
    w: 540
    h: 280
    parentId: vpc-prod

  web-1:
    id: web-1
    kind: server
    title: web-1
    subtitle: "asg · c7g.large"
    x: 440
    y: 620
    w: 220
    h: 120
    parentId: subnet-app
    spec: { host: 10.0.2.11, port: 22, user: ec2-user }
    notes: "Immutable AMI, app in /srv/app. Instances are cattle — fix the AMI, not the box."

  web-2:
    id: web-2
    kind: server
    title: web-2
    subtitle: "asg · c7g.large"
    x: 700
    y: 620
    w: 220
    h: 120
    parentId: subnet-app
    spec: { host: 10.0.2.12, port: 22, user: ec2-user }

  subnet-data:
    id: subnet-data
    kind: subnet
    title: data
    subtitle: "10.0.3.0/24 · private"
    x: 1000
    y: 540
    w: 480
    h: 280
    parentId: vpc-prod

  rds-primary:
    id: rds-primary
    kind: database
    title: rds-primary
    subtitle: "postgres 16 · r7g.xl"
    x: 1040
    y: 620
    w: 180
    h: 160
    parentId: subnet-data
    spec: { host: 10.0.3.10, port: 5432, user: ec2-user }
    notes: |
      Multi-AZ off (replica is our failover). PITR 7 days.
      Failover runbook: promote replica, flip app SSM param, restart app.

  rds-replica:
    id: rds-replica
    kind: database
    title: rds-replica
    subtitle: "read replica · reports"
    x: 1280
    y: 620
    w: 180
    h: 160
    parentId: subnet-data
    spec: { host: 10.0.3.11, port: 5432, user: ec2-user }
    notes: "Reporting reads only. If lag > 60s the nightly exports will be wrong."

edges:
  e-dns-cf:
    id: e-dns-cf
    kind: routes-to
    label: "ALIAS"
    from: route53
    to: cloudfront
  e-cf-alb:
    id: e-cf-alb
    kind: https
    label: "443"
    from: cloudfront
    to: alb
  e-cf-s3:
    id: e-cf-s3
    kind: http
    label: "/assets/*"
    from: cloudfront
    to: s3-assets
  e-alb-w1:
    id: e-alb-w1
    kind: fanout
    label: ":8080"
    from: alb
    to: web-1
  e-alb-w2:
    id: e-alb-w2
    kind: fanout
    label: ":8080"
    from: alb
    to: web-2
  e-w1-db:
    id: e-w1-db
    kind: tcp
    label: "5432"
    from: web-1
    to: rds-primary
  e-w2-db:
    id: e-w2-db
    kind: tcp
    label: "5432"
    from: web-2
    to: rds-primary
  e-w1-redis:
    id: e-w1-redis
    kind: tcp
    label: "6379"
    from: web-1
    to: elasticache
  e-w2-redis:
    id: e-w2-redis
    kind: tcp
    label: "6379"
    from: web-2
    to: elasticache
  e-repl:
    id: e-repl
    kind: replication
    label: "streaming"
    from: rds-primary
    to: rds-replica
  e-bastion-db:
    id: e-bastion-db
    kind: tunnel
    label: "ssh -L 5432"
    from: bastion
    to: rds-primary

groups: []
layers: []
