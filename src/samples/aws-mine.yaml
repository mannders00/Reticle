# Reticle sample — the infra serving reticle.live itself
#
# This is the topology behind the public demo: Cloudflare in front,
# two EC2 boxes in us-east-2 — the xlarge workhorse serving the site
# and the go services, and the t3.micro running the very daemon that
# streams this map to you. Canonical HTTP collectors observe the real public
# endpoints when collection runs.
#
# Before pointing the demo daemon at this file:
#   - set host-main's spec.host to the workhorse's private VPC IP
#     (and open its SG to the demo box) before adding an SSH probe
version: 1
nodes:
  cloudflare:
    id: cloudflare
    kind: cdn
    title: cloudflare
    subtitle: "DNS · proxy · edge TLS"
    x: 60
    y: 240
    w: 180
    h: 140
    notes: "Orange-cloud on the site, grey-cloud on demo (Caddy owns that cert). 525s mean the origin cert story broke again."
    addons:
      - { kind: cert, label: "universal SSL" }

  note-meta:
    id: note-meta
    kind: note
    title: you are here
    x: 40
    y: 460
    w: 240
    h: 180
    notes: |
      Everything on this map is the real infrastructure serving reticle.live — including the daemon streaming you this view, on the t3.micro below. Health pills are live checks, not decoration. This whole map is one topology.yaml in git.

  region-use2:
    id: region-use2
    kind: region
    title: us-east-2
    subtitle: "production"
    x: 340
    y: 40
    w: 1160
    h: 840

  box-main:
    id: box-main
    kind: box
    title: main-ec2
    subtitle: "c5.xlarge · the workhorse"
    x: 400
    y: 120
    w: 640
    h: 400
    parentId: region-use2

  host-main:
    id: host-main
    kind: vm
    title: host
    subtitle: "debian · elastic IP"
    x: 440
    y: 200
    w: 200
    h: 120
    parentId: box-main
    # ← set to the workhorse's private VPC IP + allow the demo box's SG
    spec: { host: 172.31.0.10, port: 22, user: admin }
    notes: "Everything I run lives here behind one Caddy — the site, the go services, the docker strays. Snapshot before kernel updates; there is no second workhorse."
    addons:
      - { kind: cpu, label: "4 vCPU" }
      - { kind: ram, label: "16G" }
      - { kind: disk, label: "gp3 120G" }

  caddy-main:
    id: caddy-main
    kind: gateway
    title: caddy
    subtitle: "TLS · systemd"
    x: 740
    y: 200
    w: 200
    h: 120
    parentId: box-main
    notes: "One Caddyfile fronts everything: file_server for the site, reverse_proxy per service. caddy validate before reload, always."
    addons:
      - { kind: cert, label: "auto via ACME" }

  site:
    id: site
    kind: service
    title: reticle-site
    subtitle: "static · file_server"
    x: 440
    y: 380
    w: 200
    h: 100
    parentId: box-main
    notes: "Plain files in /home/admin/reticle/web. Deploys are an rsync — no build step, no pipeline, nothing to page about."

  go-svcs:
    id: go-svcs
    kind: container
    title: go services
    subtitle: "systemd · docker"
    x: 740
    y: 380
    w: 200
    h: 100
    parentId: box-main
    notes: "Each micro-service is a single static binary + a systemd unit, listening on its own localhost port. Caddy is the only thing exposed."

  box-demo:
    id: box-demo
    kind: box
    title: demo-ec2
    subtitle: "t3.micro · you are here"
    x: 400
    y: 580
    w: 640
    h: 260
    parentId: region-use2

  caddy-demo:
    id: caddy-demo
    kind: gateway
    title: caddy
    subtitle: "TLS · systemd"
    x: 440
    y: 660
    w: 200
    h: 120
    parentId: box-demo
    notes: "Two-line Caddyfile: demo.reticle.live → 127.0.0.1:8788. Grey-cloud DNS so Caddy can hold the cert itself."

  daemon:
    id: daemon
    kind: server
    title: reticle-daemon
    subtitle: "this very process"
    x: 740
    y: 660
    w: 240
    h: 120
    parentId: box-demo
    spec: { host: 127.0.0.1, port: 22, user: admin }
    notes: "The daemon streaming this page: UI embedded, viewer-only public access, and no arbitrary shell."
    addons:
      - { kind: cpu, label: "2 vCPU" }
      - { kind: ram, label: "1G" }

collectors:
  - id: site-edge
    nodeId: cloudflare
    name: reticle.live edge
    kind: http
    url: https://reticle.live
    status: "200"
    timeoutSeconds: 8
  - id: demo-edge
    nodeId: daemon
    name: demo.reticle.live full loop
    kind: http
    url: https://demo.reticle.live
    status: "200"
    timeoutSeconds: 8

edges:
  e-cf-main:
    id: e-cf-main
    kind: https
    label: "443"
    from: cloudflare
    to: caddy-main
  e-cf-demo:
    id: e-cf-demo
    kind: https
    label: "443"
    from: cloudflare
    to: caddy-demo
  e-caddy-site:
    id: e-caddy-site
    kind: fanout
    label: "file_server"
    from: caddy-main
    to: site
  e-caddy-svcs:
    id: e-caddy-svcs
    kind: fanout
    label: "reverse_proxy"
    from: caddy-main
    to: go-svcs
  e-caddy-daemon:
    id: e-caddy-daemon
    kind: fanout
    label: ":8788"
    from: caddy-demo
    to: daemon
  e-daemon-host:
    id: e-daemon-host
    kind: tunnel
    label: "ssh · vpc"
    from: daemon
    to: host-main

groups: []
layers: []
