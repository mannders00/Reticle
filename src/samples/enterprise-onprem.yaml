# Reticle sample — on-prem datacenter
# Edge firewall → core routing → two racks drawn as generic boxes:
# a compute rack (ESXi pair + app VMs) and a data rack (Postgres pair,
# SAN, backup). Monitoring watches everything over the mgmt VLAN.
# Visual-only sample. Adapt collectors or guarded named actions from
# topology.yaml.example for your own endpoints, credentials, and services.
version: 1
nodes:
  fw-edge:
    id: fw-edge
    kind: firewall
    title: fw-edge
    subtitle: "pfsense HA pair"
    x: 60
    y: 300
    w: 180
    h: 120
    spec: { host: 172.16.0.1, port: 22, user: admin }
    notes: |
      CARP pair — this is the VIP. Rules live in git (infra/pf/).
      Change window: Tuesdays. Console access via IPMI if you cut yourself off.

  rtr-core:
    id: rtr-core
    kind: router
    title: rtr-core
    subtitle: "OSPF · vlan trunking"
    x: 320
    y: 300
    w: 180
    h: 120
    spec: { host: 172.16.0.2, port: 22, user: admin }

  sw-core:
    id: sw-core
    kind: switch
    title: sw-core
    subtitle: "2×10G to each rack"
    x: 580
    y: 300
    w: 180
    h: 120
    spec: { host: 172.16.0.3, port: 22, user: admin }
    notes: "LACP to both racks. A single link drop is invisible; watch for flapping instead."

  monitoring:
    id: monitoring
    kind: server
    title: monitoring
    subtitle: "prometheus + alertmanager"
    x: 580
    y: 560
    w: 180
    h: 120
    spec: { host: 172.16.0.9, port: 22, user: ops }
    notes: "If THIS box is red, assume everything else is unknown, not healthy."

  rack-a:
    id: rack-a
    kind: box
    title: rack A — compute
    subtitle: "row 3 · PDU a+b"
    x: 840
    y: 40
    w: 620
    h: 380
    notes: "ESXi pair with vMotion between them. One host can carry everything in a pinch — barely."

  esxi-01:
    id: esxi-01
    kind: server
    title: esxi-01
    subtitle: "2×Xeon · 512G"
    x: 880
    y: 120
    w: 200
    h: 120
    parentId: rack-a
    spec: { host: 172.16.10.11, port: 22, user: root }

  esxi-02:
    id: esxi-02
    kind: server
    title: esxi-02
    subtitle: "2×Xeon · 512G"
    x: 1160
    y: 120
    w: 200
    h: 120
    parentId: rack-a
    spec: { host: 172.16.10.12, port: 22, user: root }

  vm-app-01:
    id: vm-app-01
    kind: vm
    title: vm-app-01
    subtitle: "erp app · debian 12"
    x: 880
    y: 280
    w: 200
    h: 120
    parentId: rack-a
    spec: { host: 172.16.20.21, port: 22, user: deploy }
    notes: "Pinned to esxi-01 by DRS rule (license is host-bound, ask legal, don't ask why)."

  vm-app-02:
    id: vm-app-02
    kind: vm
    title: vm-app-02
    subtitle: "erp app · debian 12"
    x: 1160
    y: 280
    w: 200
    h: 120
    parentId: rack-a
    spec: { host: 172.16.20.22, port: 22, user: deploy }

  rack-b:
    id: rack-b
    kind: box
    title: rack B — data
    subtitle: "row 3 · PDU a+b"
    x: 840
    y: 460
    w: 620
    h: 380
    notes: "Everything here is stateful. Power work on this rack requires the DBA on the call."

  db-primary:
    id: db-primary
    kind: database
    title: db-primary
    subtitle: "postgres 16"
    x: 880
    y: 540
    w: 180
    h: 160
    parentId: rack-b
    spec: { host: 172.16.30.31, port: 22, user: postgres }
    notes: |
      Synchronous replication to db-standby — a standby outage BLOCKS writes
      by design. Runbook: infra/runbooks/db-failover.md

  db-standby:
    id: db-standby
    kind: database
    title: db-standby
    subtitle: "sync standby"
    x: 1160
    y: 540
    w: 180
    h: 160
    parentId: rack-b
    spec: { host: 172.16.30.32, port: 22, user: postgres }

  san-01:
    id: san-01
    kind: object-store
    title: san-01
    subtitle: "iSCSI · 40T usable"
    x: 880
    y: 700
    w: 180
    h: 120
    parentId: rack-b
    spec: { host: 172.16.30.40, port: 22, user: admin }
    notes: "Both ESXi hosts and the DB pair boot from here. This box is the blast radius."

  backup-01:
    id: backup-01
    kind: server
    title: backup-01
    subtitle: "veeam + offsite sync"
    x: 1160
    y: 700
    w: 200
    h: 120
    parentId: rack-b
    spec: { host: 172.16.30.50, port: 22, user: veeam }
    notes: "3-2-1: SAN snapshots → this box → offsite. Restore test is the first Monday monthly."

edges:
  e-fw-rtr:
    id: e-fw-rtr
    kind: ethernet
    label: "10G"
    from: fw-edge
    to: rtr-core
  e-rtr-sw:
    id: e-rtr-sw
    kind: ethernet
    label: "2×10G LACP"
    from: rtr-core
    to: sw-core
  e-sw-esxi1:
    id: e-sw-esxi1
    kind: ethernet
    label: ""
    from: sw-core
    to: esxi-01
  e-sw-esxi2:
    id: e-sw-esxi2
    kind: ethernet
    label: ""
    from: sw-core
    to: esxi-02
  e-sw-db1:
    id: e-sw-db1
    kind: ethernet
    label: ""
    from: sw-core
    to: db-primary
  e-app1-db:
    id: e-app1-db
    kind: tcp
    label: "5432"
    from: vm-app-01
    to: db-primary
  e-app2-db:
    id: e-app2-db
    kind: tcp
    label: "5432"
    from: vm-app-02
    to: db-primary
  e-repl:
    id: e-repl
    kind: replication
    label: "sync"
    from: db-primary
    to: db-standby
  e-db1-san:
    id: e-db1-san
    kind: tcp
    label: "iSCSI/3260"
    from: db-primary
    to: san-01
  e-db2-san:
    id: e-db2-san
    kind: tcp
    label: "iSCSI/3260"
    from: db-standby
    to: san-01
  e-backup-san:
    id: e-backup-san
    kind: depends-on
    label: "snapshots"
    from: backup-01
    to: san-01
  e-mon-esxi1:
    id: e-mon-esxi1
    kind: mgmt
    label: "scrape"
    from: monitoring
    to: esxi-01
  e-mon-db:
    id: e-mon-db
    kind: mgmt
    label: "scrape"
    from: monitoring
    to: db-primary

groups: []
layers: []
